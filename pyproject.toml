[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "holoforge"
version = "0.4.0"
description = "Local 2D photo to Looking Glass hologram converter using MiniMax H3 camera orbits"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "HoloForge contributors" }]
keywords = ["looking-glass", "light-field", "hologram", "minimax-h3", "comfyui", "quilt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

# The heavy lifting (MiniMax H3) runs in ComfyUI; HoloForge itself needs no PyTorch.
dependencies = [
  "gradio>=5.12,<7",
  "numpy>=2.0",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11.0",
]

[project.urls]
Homepage = "https://github.com/dtaddis/HoloForge"
Repository = "https://github.com/dtaddis/HoloForge.git"
Issues = "https://github.com/dtaddis/HoloForge/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
holoforge = "holoforge.cli:main"
holoforge-ui = "holoforge.app:main"
holoforge-portrait = "holoforge.cli:portrait_main"

[tool.hatch.build.targets.wheel]
packages = ["src/holoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
