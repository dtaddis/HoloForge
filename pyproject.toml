[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "holoforge"
version = "0.3.0"
description = "Local, generative 2D photo to Looking Glass light-field quilt converter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "HoloForge contributors" }]
keywords = ["looking-glass", "light-field", "hologram", "depth", "inpainting"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

dependencies = [
  "accelerate>=1.2",
  "diffusers>=0.32",
  "gradio>=5.12,<7",
  "huggingface-hub>=0.27",
  "numpy>=2.0",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11.0",
  "safetensors>=0.5",
  "torch>=2.11",
  "torchvision>=0.26",
  "transformers>=4.48",
]

[project.urls]
Homepage = "https://github.com/dtaddis/HoloForge"
Repository = "https://github.com/dtaddis/HoloForge.git"
Issues = "https://github.com/dtaddis/HoloForge/issues"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
holoforge = "holoforge.cli:main"
holoforge-ui = "holoforge.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/holoforge"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
